<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Log In - My Investment Library</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #172033;
    }

    .container {
      max-width: 500px;
      margin: 100px auto;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #111827;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #263247;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }

    .home-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="box">

    <h1>🔐 Log In</h1>

    <p>My Investment Library</p>

    <label>Email</label>
    <input
      type="email"
      id="email"
      placeholder="Your email"
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Your password"
    >

    <button onclick="login()">
      Log In
    </button>

    <p id="message"></p>

    <a href="index.html" class="home-link">
      ← Back to Home
    </a>

  </div>

</div>


<script>

async function login() {

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("message");


  message.textContent = "Logging in...";


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });


  if (error) {

    message.textContent =
      "Login failed: " + error.message;

    return;
  }


  message.textContent = "Login successful!";


  window.location.href = "management.html";

}

</script>

</body>
</html>
