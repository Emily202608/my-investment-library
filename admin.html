<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin - My Investment Library</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #172033;
    }

    .container {
      max-width: 600px;
      margin: 80px auto;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    h2 {
      margin-top: 30px;
    }

    label {
      display: block;
      margin-top: 5px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0 18px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #111827;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #263247;
    }

    #message,
    #publish-message {
      margin-top: 15px;
      font-weight: bold;
    }

    #admin-panel {
      display: none;
      margin-top: 30px;
      border-top: 1px solid #ddd;
      padding-top: 20px;
    }

  </style>
</head>


<body>

  <div class="container">

    <div class="box">

      <!-- LOGIN -->

      <h1>🔐 Admin Login</h1>

      <p>My Investment Library</p>

      <label>Email</label>

      <input
        type="email"
        id="email"
        placeholder="Your email"
      >

      <label>Password</label>

      <input
        type="password"
        id="password"
        placeholder="Your password"
      >

      <button onclick="login()">
        Login
      </button>

      <p id="message"></p>


      <!-- ADMIN PANEL -->

      <div id="admin-panel">

        <h2>➕ Add New Investment</h2>


        <label>Title</label>

        <input
          type="text"
          id="title"
          placeholder="Article or video title"
        >


        <label>URL</label>

        <input
          type="url"
          id="url"
          placeholder="https://..."
        >


        <label>Type</label>

        <input
          type="text"
          id="type"
          placeholder="Article, Video, News..."
        >


        <label>Ticker</label>

        <input
          type="text"
          id="ticker"
          placeholder="MU, NVDA, COIN..."
        >


        <label>Category</label>

        <input
          type="text"
          id="category"
          placeholder="Semiconductors, Crypto, Energy..."
        >


        <label>Tags</label>

        <input
          type="text"
          id="tags"
          placeholder="AI, HBM, Bitcoin..."
        >


        <label>Description</label>

        <input
          type="text"
          id="description"
          placeholder="Short description"
        >


        <label>My Note</label>

        <input
          type="text"
          id="my_note"
          placeholder="Why I saved this"
        >


        <button onclick="addInvestment()">
          Publish
        </button>

        <p id="publish-message"></p>

      </div>

    </div>

  </div>


  <script>

    // -------------------------
    // ADMIN LOGIN
    // -------------------------

    async function login() {

      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;

      const message =
        document.getElementById("message");


      message.textContent = "Logging in...";


      const { data, error } =
        await supabaseClient.auth.signInWithPassword({

          email: email,

          password: password

        });


      if (error) {

        message.textContent =
          "Login failed: " + error.message;

        console.error(error);

        return;
      }


      message.textContent =
        "Login successful!";


      document
        .getElementById("admin-panel")
        .style.display = "block";

    }



    // -------------------------
    // ADD INVESTMENT
    // -------------------------

    async function addInvestment() {

      const publishMessage =
        document.getElementById(
          "publish-message"
        );


      const newItem = {

        title:
          document.getElementById(
            "title"
          ).value,

        url:
          document.getElementById(
            "url"
          ).value,

        type:
          document.getElementById(
            "type"
          ).value,

        ticker:
          document.getElementById(
            "ticker"
          ).value,

        category:
          document.getElementById(
            "category"
          ).value,

        tags:
          document.getElementById(
            "tags"
          ).value,

        description:
          document.getElementById(
            "description"
          ).value,

        my_note:
          document.getElementById(
            "my_note"
          ).value

      };


      if (!newItem.title) {

        publishMessage.textContent =
          "Please enter a title.";

        return;
      }


      publishMessage.textContent =
        "Publishing...";


      const { data, error } =
        await supabaseClient
          .from("items")
          .insert([newItem])
          .select();


      if (error) {

        publishMessage.textContent =
          "Publish failed: "
          + error.message;

        console.error(error);

        return;
      }


      publishMessage.textContent =
        "Published successfully!";


      // Clear form after publishing

      document.getElementById("title").value = "";
      document.getElementById("url").value = "";
      document.getElementById("type").value = "";
      document.getElementById("ticker").value = "";
      document.getElementById("category").value = "";
      document.getElementById("tags").value = "";
      document.getElementById("description").value = "";
      document.getElementById("my_note").value = "";

    }

  </script>

</body>

</html>
