<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Log In - My Investment Library</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #172033;

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 620px;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #526071;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 20px;

      border: 1px solid #ccc;
      border-radius: 6px;

      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #111827;
    }

    .login-button {
      width: 100%;

      padding: 13px;

      background: #111827;
      color: white;

      border: none;
      border-radius: 6px;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    .login-button:hover {
      background: #263247;
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      font-weight: bold;
      line-height: 1.5;
    }

    .back {
      margin-top: 25px;
      text-align: center;
    }

    .back a {
      color: #2563eb;
      text-decoration: none;
    }

    .back a:hover {
      text-decoration: underline;
    }

  </style>

</head>


<body>

  <div class="container">

    <div class="box">

      <h1>🔐 Log In</h1>

      <p class="subtitle">
        My Investment Library
      </p>


      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Your email"
        autocomplete="email"
      >


      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Your password"
        autocomplete="current-password"
      >


      <button
        id="login-button"
        class="login-button"
        onclick="login()"
      >
        Log In
      </button>


      <p id="message"></p>


      <div class="back">

        <a href="index.html">
          ← Back to My Investment Library
        </a>

      </div>

    </div>

  </div>


<script>

  // ---------------------------------
  // LOGIN
  // ---------------------------------

  async function login() {

    const email =
      document.getElementById("email")
        .value
        .trim();

    const password =
      document.getElementById("password")
        .value;

    const message =
      document.getElementById("message");

    const loginButton =
      document.getElementById("login-button");


    // Check fields

    if (!email || !password) {

      message.textContent =
        "Please enter your email and password.";

      return;
    }


    message.textContent =
      "Logging in...";

    loginButton.disabled = true;


    try {

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({

          email: email,
          password: password

        });


      if (error) {

        message.textContent =
          "Login failed: " + error.message;

        loginButton.disabled = false;

        return;
      }


      if (!data.session) {

        message.textContent =
          "Login failed. No session was created.";

        loginButton.disabled = false;

        return;
      }


      message.textContent =
        "Login successful! Opening management...";


      // Go to management page

      window.location.href =
        "management.html";


    }

    catch (error) {

      console.error(error);

      message.textContent =
        "Login failed. Please try again.";

      loginButton.disabled = false;

    }

  }



  // ---------------------------------
  // PRESS ENTER TO LOGIN
  // ---------------------------------

  document
    .getElementById("password")
    .addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          login();

        }

      }
    );



  // ---------------------------------
  // CHECK EXISTING LOGIN
  // ---------------------------------

  async function checkExistingSession() {

    const {
      data: { session }
    } =
      await supabaseClient.auth.getSession();


    // Already logged in?
    // Go directly to management.

    if (session) {

      window.location.href =
        "management.html";

    }

  }


  checkExistingSession();

</script>


</body>

</html>
