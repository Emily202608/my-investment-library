<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Add New Content | My Investment Library</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <!-- Rich Text Editor -->
  <link href="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #172033;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .header-actions a,
    .header-actions button {
      padding: 9px 13px;
      border: none;
      border-radius: 7px;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
    }

    .back-link {
      background: white;
      color: #111827;
    }

    .logout-button {
      background: #374151;
      color: white;
    }

    .container {
      max-width: 1180px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .panel {
      background: white;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
      margin-bottom: 30px;
    }

    h2,
    h3 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 10px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 11px;
      margin: 7px 0 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .primary-button,
    .secondary-button,
    .danger-button {
      padding: 10px 14px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary-button {
      background: #111827;
      color: white;
    }

    .secondary-button {
      background: #e5e7eb;
      color: #111827;
    }

    .danger-button {
      background: #b91c1c;
      color: white;
    }

    .item-list {
      display: grid;
      gap: 16px;
      margin-top: 20px;
    }

    .item-card {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 18px;
      background: #fafafa;
    }

    .item-card p {
      margin: 6px 0;
      color: #526071;
      line-height: 1.5;
    }

    .item-actions {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tag {
      display: inline-block;
      padding: 5px 9px;
      margin: 3px 3px 0 0;
      background: #e8edf3;
      border-radius: 18px;
      font-size: 12px;
    }

    .edit-box {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #ddd;
      display: none;
    }

    .message {
      margin-top: 14px;
      font-weight: bold;
    }

    .helper {
      margin-top: -8px;
      margin-bottom: 14px;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.5;
    }

    #login-warning {
      display: none;
      background: #fff3cd;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 25px;
    }

    .rich-editor {
      margin: 7px 0 15px;
      background: white;
    }

    .rich-editor .ql-toolbar {
      border-radius: 6px 6px 0 0;
    }

    .rich-editor .ql-container {
      min-height: 300px;
      border-radius: 0 0 6px 6px;
      font-family: Arial, sans-serif;
      font-size: 16px;
    }

    .rich-editor .ql-editor {
      min-height: 300px;
      line-height: 1.7;
    }

    .edit-box .rich-editor .ql-container,
    .edit-box .rich-editor .ql-editor {
      min-height: 240px;
    }

    .review-images-section {
      margin: 18px 0 24px;
      padding: 20px;
      border: 1px solid #d7dee8;
      border-radius: 10px;
      background: #f8fafc;
    }

    .review-images-section[hidden] {
      display: none;
    }

    .review-image-input {
      margin-bottom: 8px;
      background: white;
    }

    .review-image-preview {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 14px;
      margin-top: 12px;
    }

    .review-image-card {
      position: relative;
      overflow: hidden;
      border: 1px solid #d7dee8;
      border-radius: 9px;
      background: white;
    }

    .review-image-card img {
      width: 100%;
      height: 130px;
      display: block;
      object-fit: cover;
    }

    .review-image-card button {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 50%;
      background: rgba(17, 24, 39, .86);
      color: white;
      cursor: pointer;
      font-size: 17px;
      line-height: 1;
    }

    @media (max-width: 800px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<!-- North Current Daily Review build: 2026-09-03-v3 -->

<header>

  <h1>Add New Content</h1>

  <div class="header-actions">

    <a
      href="management.html"
      class="back-link"
    >
      ← Back to Management
    </a>

    <button
      class="logout-button"
      onclick="logout()"
    >
      Log Out
    </button>

  </div>

</header>


<div class="container">

  <div id="login-warning">
    <strong>You are not logged in.</strong>
    <br><br>
    <a href="admin.html">Go to Log In</a>
  </div>


  <div id="management-content">


    <!-- =========================
         ADD NEW CONTENT
    ========================== -->

    <div class="panel">

      <h2>➕ Add New Content</h2>

      <div class="grid-2">

        <div>
          <label>Title</label>
          <input id="new-title" type="text">
        </div>

        <div>
          <label>URL</label>
          <input id="new-url" type="url" placeholder="https://...">
        </div>

      </div>


      <div class="grid-2">

        <div>

          <label>Type</label>

          <select id="new-type" data-build="daily-review-v3">
            <option value="Article">Article</option>
            <option value="News">News</option>
            <option value="Research">Research</option>
            <option value="Image">Image</option>
            <option value="Video">Video</option>
            <option value="Investment Idea">Investment Idea</option>
          </select>

        </div>

        <div>

          <label>Ticker</label>

          <input
            id="new-ticker"
            type="text"
            placeholder="MU, NVDA..."
          >

        </div>

      </div>


      <label>Category</label>

      <select id="new-category">

        <option value="Macro Trends">
          Macro Trends
        </option>

        <option value="Fundamental Analysis">
          Fundamental Analysis
        </option>

        <option value="Price Action Analysis">
          Price Action Analysis
        </option>

        <option value="Trading Psychology">
          Trading Psychology
        </option>

        <option value="Trading Strategies">
          Trading Strategies
        </option>

        <option value="My Trade Reviews">
          Daily Review
        </option>

        <option value="My Videos">
          My Videos
        </option>

        <option value="Selected YouTube Videos">
          Selected YouTube Videos
        </option>

      </select>


      <label>Tags</label>

      <input
        id="new-tags"
        type="text"
        placeholder="AI, HBM, Earnings..."
      >


      <label>Description</label>

      <textarea id="new-description" placeholder="Short summary shown in article lists."></textarea>


      <label>Article Content</label>

      <div id="new-content-editor" class="rich-editor"></div>

      <section id="review-images-section" class="review-images-section" hidden>
        <label for="review-images">Review Images</label>

        <div class="helper">
          Upload charts, screenshots, or visual notes for this daily review.
          You can select several images and remove any image before publishing.
        </div>

        <input
          id="review-images"
          class="review-image-input"
          type="file"
          accept="image/*"
          multiple
        >

        <div id="review-image-preview" class="review-image-preview"></div>
      </section>


      <label>My Note</label>

      <textarea id="new-note"></textarea>


      <button
        class="primary-button"
        onclick="addContent()"
      >
        Publish
      </button>


      <div
        id="content-message"
        class="message"
      ></div>

    </div>

    <!-- WATCH LIST MANAGEMENT -->

    </div>

</div>


<script>

/* ========================================
   LOGIN CHECK
======================================== */

async function checkLogin() {

  const {
    data: { session }
  } =
    await supabaseClient.auth.getSession();


  if (!session) {

    document
      .getElementById(
        "management-content"
      )
      .style.display =
      "none";


    document
      .getElementById(
        "login-warning"
      )
      .style.display =
      "block";


    return;
  }

  initializeNewEditor();
}


/* ========================================
   ADD CONTENT
======================================== */

async function addContent() {

  const message =
    document.getElementById(
      "content-message"
    );


  const item = {

    title:
      document
        .getElementById(
          "new-title"
        )
        .value
        .trim(),

    url:
      document
        .getElementById(
          "new-url"
        )
        .value
        .trim(),

    type:
      document
        .getElementById(
          "new-type"
        )
        .value,

    ticker:
      document
        .getElementById(
          "new-ticker"
        )
        .value
        .trim()
        .toUpperCase(),

    category:
      document
        .getElementById(
          "new-category"
        )
        .value,

    tags:
      document
        .getElementById(
          "new-tags"
        )
        .value
        .trim(),

    description:
      document
        .getElementById(
          "new-description"
        )
        .value
        .trim(),

    my_note:
      document
        .getElementById(
          "new-note"
        )
        .value
        .trim(),

    content_html:
      getNewEditorHtml()
  };


  if (!item.title) {

    message.textContent =
      "Please enter a title.";

    return;
  }


  message.textContent =
    "Publishing...";

  try {
    const imageUrls =
      item.category === "My Trade Reviews"
        ? await uploadReviewImages(reviewImageFiles)
        : [];

    if (imageUrls.length) {
      item.content_html =
        [item.content_html, buildReviewImagesHtml(imageUrls)]
          .filter(Boolean)
          .join("");
    }
  } catch (error) {
    console.error(error);
    message.textContent =
      "Image upload failed: " + error.message;
    return;
  }


  const {
    data: savedItem,
    error
  } =
    await supabaseClient
      .from("items")
      .insert([item])
      .select("id")
      .single();


  if (error) {

    console.error(error);

    message.textContent =
      "Publish failed: "
      + error.message;

    return;
  }


  const {
    error: contentError
  } =
    await supabaseClient
      .from("item_content")
      .upsert(
        {
          item_id: Number(savedItem.id),
          content_html: item.content_html,
          my_note: item.my_note
        },
        {
          onConflict: "item_id"
        }
      );


  if (contentError) {

    console.error(contentError);

    message.textContent =
      "The review was created, but its text and images could not be saved: " +
      contentError.message;

    return;
  }


  message.textContent =
    "Published successfully!";


  document
    .getElementById(
      "new-title"
    )
    .value = "";


  document
    .getElementById(
      "new-url"
    )
    .value = "";


  document
    .getElementById(
      "new-ticker"
    )
    .value = "";


  document
    .getElementById(
      "new-tags"
    )
    .value = "";


  document
    .getElementById(
      "new-description"
    )
    .value = "";


  document
    .getElementById(
      "new-note"
    )
    .value = "";

  if (newContentEditor) {
    newContentEditor.setContents([]);
  }

  clearReviewImages();

}


/* ========================================
   RICH TEXT EDITORS
======================================== */

const quillToolbarOptions = [
  [{ header: [1, 2, 3, false] }],
  [{ size: ["small", false, "large", "huge"] }],
  ["bold", "italic", "underline", "strike"],
  [{ color: [] }, { background: [] }],
  [{ list: "ordered" }, { list: "bullet" }],
  [{ indent: "-1" }, { indent: "+1" }],
  [{ align: [] }],
  ["blockquote", "link"],
  ["clean"]
];

let newContentEditor = null;
let reviewImageFiles = [];


function updateReviewImagesVisibility() {

  const category =
    document.getElementById("new-category").value;

  document
    .getElementById("review-images-section")
    .hidden = category !== "My Trade Reviews";
}


function renderReviewImagePreview() {

  const preview =
    document.getElementById("review-image-preview");

  preview.innerHTML = "";

  reviewImageFiles.forEach((file, index) => {
    const card = document.createElement("div");
    card.className = "review-image-card";

    const image = document.createElement("img");
    image.src = URL.createObjectURL(file);
    image.alt = file.name;
    image.onload = () => URL.revokeObjectURL(image.src);

    const removeButton = document.createElement("button");
    removeButton.type = "button";
    removeButton.setAttribute("aria-label", "Remove " + file.name);
    removeButton.textContent = "×";
    removeButton.addEventListener("click", () => {
      reviewImageFiles.splice(index, 1);
      renderReviewImagePreview();
    });

    card.append(image, removeButton);
    preview.appendChild(card);
  });
}


function handleReviewImages(event) {

  const selected =
    Array.from(event.target.files || [])
      .filter(file => file.type.startsWith("image/"));

  reviewImageFiles =
    reviewImageFiles.concat(selected).slice(0, 10);

  event.target.value = "";
  renderReviewImagePreview();
}


function clearReviewImages() {
  reviewImageFiles = [];
  document.getElementById("review-images").value = "";
  renderReviewImagePreview();
}


async function uploadReviewImages(files) {

  if (!files.length) {
    return [];
  }

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (!session) {
    throw new Error("Please log in again before uploading images.");
  }

  const urls = [];

  for (const file of files) {
    const extension =
      (file.name.split(".").pop() || "jpg")
        .toLowerCase()
        .replace(/[^a-z0-9]/g, "") || "jpg";

    const path =
      session.user.id + "/" +
      new Date().toISOString().slice(0, 10) + "/" +
      crypto.randomUUID() + "." + extension;

    const { error } =
      await supabaseClient.storage
        .from("review-images")
        .upload(path, file, {
          cacheControl: "3600",
          contentType: file.type,
          upsert: false
        });

    if (error) {
      throw error;
    }

    const { data } =
      supabaseClient.storage
        .from("review-images")
        .getPublicUrl(path);

    urls.push(data.publicUrl);
  }

  return urls;
}


function buildReviewImagesHtml(urls) {
  return `
    <section class="saved-review-images">
      <h2>Review Images</h2>
      <div class="saved-review-image-grid">
        ${urls.map((url, index) => `
          <img src="${safeAttr(url)}" alt="Daily review image ${index + 1}">
        `).join("")}
      </div>
    </section>
  `;
}


function initializeNewEditor() {

  const editorElement =
    document.getElementById(
      "new-content-editor"
    );

  if (
    !editorElement ||
    newContentEditor
  ) {
    return;
  }

  newContentEditor =
    new Quill(
      editorElement,
      {
        theme: "snow",
        placeholder:
          "Paste or write the full article here...",
        modules: {
          toolbar:
            quillToolbarOptions
        }
      }
    );

  document
    .getElementById("new-category")
    .addEventListener("change", updateReviewImagesVisibility);

  document
    .getElementById("review-images")
    .addEventListener("change", handleReviewImages);

  updateReviewImagesVisibility();
}



function getNewEditorHtml() {

  if (!newContentEditor) {
    return "";
  }

  const html =
    newContentEditor.root
      .innerHTML
      .trim();

  return html === "<p><br></p>"
    ? ""
    : html;
}




/* ========================================
   LOG OUT
======================================== */

async function logout() {

  await supabaseClient.auth.signOut();

  window.location.href =
    "index.html";
}


/* ========================================
   HELPERS
======================================== */

function safe(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );
}


function safeAttr(value) {

  return safe(value);
}


function optionList(
  options,
  selected
) {

  return options
    .map(
      option => `

        <option
          value="${safeAttr(option)}"
          ${
            option === selected
              ? "selected"
              : ""
          }
        >
          ${safe(option)}
        </option>

      `
    )
    .join("");
}


/* ========================================
   START
======================================== */

checkLogin();

</script>

</body>

</html>
