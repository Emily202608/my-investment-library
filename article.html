<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Investment Article | North Current Research</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <!-- Quill -->
  <link
    href="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.snow.css"
    rel="stylesheet"
  >
  <script src="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.js"></script>

  <!-- HTML Sanitizer -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>

  <style>
    * {

    }

    body {

      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #172033;

    header {

    .header-inner {

    }

    .back-link {
      color: white;

    }

    .back-link:hover {

    }

    .header-buttons {

      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .edit-button,
    .print-button {
      background: white;
      color: #111827;
    }

    .edit-button:hover,
    .print-button:hover {

    }

    .delete-button {

    }

    .delete-button:hover {

    }

    .container {
      max-width: 900px;
      margin: 45px auto;

    }

    .article,
    .edit-mode {
      background: white;

      border-radius: 12px;

    }

    h1 {
      margin-top: 0;

    .members-badge {

    .dates {
      margin-top: 16px;

    }

    .section {

    .section h2 {

    .article-content {

    .article-content h1 {

    .article-content p {

    .article-content blockquote {

      border-left: 4px solid #9ca3af;
      background: #f8fafc;

    }

    .article-content ul,
    .article-content ol {
      line-height: 1.8;

    }

    .article-content ol {

    }

    .article-content ul {

    .article-content li {

    }

    .login-to-read:hover {

    }

    .locked-card {

    .locked-card p {
      color: #526071;

    }

    label {
      display: block;

    }

    input,
    textarea,
    select {
      width: 100%;

    textarea {

    #inline-editor {

    #inline-editor .ql-container {
      min-height: 450px;
      font-family: Arial, sans-serif;

    }

    #inline-editor .ql-editor {
      min-height: 450px;

    }

    .edit-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .save-button,
    .cancel-button {
      padding: 11px 17px;

      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .save-button {
      background: #111827;
      color: white;
    }

    .cancel-button {
      background: #e5e7eb;
      color: #111827;
    }

    #save-message {
      margin-top: 15px;
      font-weight: bold;
    }

    #floating-toolbar {
      display: none;
      position: fixed;
      z-index: 5000;
      padding: 6px;
      background: #111827;
      border-radius: 8px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.25);

      align-items: center;
    }

    #floating-toolbar button {
      border: none;
      background: transparent;
      color: white;
      padding: 7px 9px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    #floating-toolbar button:hover {
      background: #374151;
    }

    .highlight-icon {
      background: #fff59d !important;
      color: #111827 !important;
    }

    #context-menu {
      display: none;
      position: fixed;
      z-index: 6000;
      width: 190px;
      background: white;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.20);
      overflow: hidden;
    }

    #context-menu button {
      width: 100%;
      border: none;
      background: white;
      padding: 10px 13px;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
    }

    #context-menu button:hover {
      background: #f3f4f6;
    }

    .menu-divider {
      height: 1px;
      background: #e5e7eb;
    }

    .message {
      background: white;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
    }

    @media (max-width: 700px) {
      .article,
      .edit-mode {
        padding: 25px;
      }

      h1 {
        font-size: 29px;
      }

      .grid-2 {
        grid-template-columns: 1fr;
      }

      .header-inner {
        align-items: flex-start;
      }
    }

    @media print {
      header,
      #floating-toolbar,
      #context-menu {
        display: none !important;
      }

      body {
        background: white;
      }

      .container {
        margin: 0 auto;
      }

      .article {
        box-shadow: none;
        padding: 0;
      }

  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <a
      href="index.html"
      class="back-link"
    >
      ← Back to Research
    </a>

    <div class="header-buttons">

      <button
        id="print-button"
        class="print-button"
        onclick="printArticle()"
      >
        🖨 Print
      </button>

      <button
        id="edit-button"
        class="edit-button"
        onclick="enterEditMode()"
      >
        ✏ Edit
      </button>

      <button
        id="delete-button"
        class="delete-button"
        onclick="deleteArticle()"
      >
        🗑 Delete
      </button>

    </div>

  </div>
</header>


<div class="container">
  <div id="article-container">
    <div class="message">
      Loading article...
    </div>
  </div>
</div>


<!-- FLOATING TOOLBAR -->

<div id="floating-toolbar">

  <button onclick="applyFormat('bold')">B</button>
  <button onclick="applyFormat('italic')">I</button>
  <button onclick="applyFormat('underline')">U</button>

  <button
    class="highlight-icon"
    onclick="toggleHighlight()"
  >
    Highlight
  </button>

  <button onclick="applySize('large')">A+</button>
  <button onclick="applySize(false)">A</button>

</div>


<!-- RIGHT CLICK MENU -->

<div id="context-menu">

  <button onclick="applyFormat('bold')">Bold</button>
  <button onclick="applyFormat('italic')">Italic</button>
  <button onclick="applyFormat('underline')">Underline</button>

  <div class="menu-divider"></div>

  <button onclick="toggleHighlight()">Highlight</button>
  <button onclick="applyTextColor('#b91c1c')">Red Text</button>
  <button onclick="applyTextColor('#2563eb')">Blue Text</button>
  <button onclick="applyTextColor('#111827')">Black Text</button>

  <div class="menu-divider"></div>

  <button onclick="applySize('small')">Small Text</button>
  <button onclick="applySize(false)">Normal Text</button>
  <button onclick="applySize('large')">Large Text</button>
  <button onclick="applySize('huge')">Extra Large</button>

  <div class="menu-divider"></div>

  <button onclick="applyFont(false)">Sans Font</button>
  <button onclick="applyFont('serif')">Serif Font</button>
  <button onclick="applyFont('monospace')">Monospace Font</button>

  <div class="menu-divider"></div>

  <button onclick="clearSelectedFormatting()">Clear Formatting</button>

</div>


<script>

const ADMIN_UID =
  "a5bc1b7d-ca11-49f3-8e95-1d99b12031fa";

let currentArticle = null;
let currentArticleId = null;
let currentSession = null;

let currentContentHtml = "";
let currentMyNote = "";
let hasProtectedAccess = false;

let inlineEditor = null;
let lastSelection = null;


/* ========================================
   QUILL TOOLBAR
======================================== */

const toolbarOptions = [

  [
    {
      header:
        [1, 2, 3, false]
    }
  ],

  [
    {
      font:
        [
          false,
          "serif",
          "monospace"
        ]
    }
  ],

  [
    {
      size:
        [
          "small",
          false,
          "large",
          "huge"
        ]
    }
  ],

  [
    "bold",
    "italic",
    "underline",
    "strike"
  ],

  [
    { color: [] },
    { background: [] }
  ],

  [
    { list: "ordered" },
    { list: "bullet" }
  ],

  [
    { indent: "-1" },
    { indent: "+1" }
  ],

  [
    { align: [] }
  ],

  [
    "blockquote",
    "link"
  ],

  [
    "clean"
  ]

];


/* ========================================
   ADMIN CHECK
======================================== */

function isAdminSession() {

  return Boolean(
    currentSession &&
    currentSession.user &&
    currentSession.user.id === ADMIN_UID
  );

}


/* ========================================
   AUTH UI
======================================== */

function updateAuthUI() {

  const editButton =
    document.getElementById("edit-button");

  const printButton =
    document.getElementById("print-button");

  const deleteButton =
    document.getElementById("delete-button");


  if (isAdminSession()) {

    editButton.style.display =
      "inline-block";

    printButton.style.display =
      "inline-block";

    deleteButton.style.display =
      "inline-block";

  } else {

    editButton.style.display =
      "none";

    printButton.style.display =
      "none";

    deleteButton.style.display =
      "none";

    if (inlineEditor) {
      forceExitEditMode();
    }
  }
}


/* ========================================
   PRINT
======================================== */

async function printArticle() {

  const {
    data: {
      session
    }
  } =
    await supabaseClient.auth.getSession();


  currentSession =
    session;


  if (!isAdminSession()) {

    updateAuthUI();

    return;
  }


  window.print();

}


/* ========================================
   DELETE
======================================== */

async function deleteArticle() {

  const {
    data: {
      session
    }
  } =
    await supabaseClient.auth.getSession();


  currentSession =
    session;


  if (!isAdminSession()) {

    updateAuthUI();

    alert(
      "Admin access only."
    );

    return;
  }


  if (!currentArticleId) {
    return;
  }


  const title =
    currentArticle &&
    currentArticle.title
      ? currentArticle.title
      : "this article";


  const confirmed =
    window.confirm(
      'Permanently delete "' +
      title +
      '"?\n\nThis cannot be undone.'
    );


  if (!confirmed) {
    return;
  }


  /*
    Delete protected content first.
    This works whether the row exists or not.
  */

  const {
    error: contentError
  } =
    await supabaseClient
      .from("item_content")
      .delete()
      .eq(
        "item_id",
        currentArticleId
      );


  if (contentError) {

    console.error(
      "Protected content delete error:",
      contentError
    );

    alert(
      "Delete failed: " +
      contentError.message
    );

    return;
  }


  /*
    Delete the main article record.
  */

  const {
    error: itemError
  } =
    await supabaseClient
      .from("items")
      .delete()
      .eq(
        "id",
        currentArticleId
      );


  if (itemError) {

    console.error(
      "Article delete error:",
      itemError
    );

    alert(
      "Delete failed: " +
      itemError.message
    );

    return;
  }


  alert(
    "Article deleted."
  );


  window.location.href =
    "index.html";

}


/* ========================================
   CHECK CURRENT LOGIN
======================================== */

async function checkLogin() {

  const {
    data: {
      session
    }
  } =
    await supabaseClient
      .auth
      .getSession();


  currentSession =
    session;


  updateAuthUI();

}


/* ========================================
   REAL-TIME AUTH CHANGE
======================================== */

supabaseClient
  .auth
  .onAuthStateChange(
    function(
      event,
      session
    ) {

      currentSession =
        session;

      updateAuthUI();

      if (currentArticle) {
        loadArticle();
      }

    }
  );


/* ========================================
   FORCE EXIT EDIT MODE
======================================== */

function forceExitEditMode() {

  inlineEditor =
    null;

  lastSelection =
    null;

  hideFloatingTools();


  if (currentArticle) {
    renderReadMode();
  }

}


/* ========================================
   LOAD ARTICLE
======================================== */

async function loadArticle() {

  const container =
    document.getElementById(
      "article-container"
    );


  const params =
    new URLSearchParams(
      window.location.search
    );


  currentArticleId =
    params.get("id");


  if (!currentArticleId) {

    container.innerHTML =
      `
        <div class="message">
          Article not found.
        </div>
      `;

    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("items")
      .select(
        "id, created_at, updated_at, title, type, ticker, tags, description, preview, url, category, access_level"
      )
      .eq(
        "id",
        currentArticleId
      )
      .single();


  if (
    error ||
    !data
  ) {

    console.error(error);

    container.innerHTML =
      `
        <div class="message">
          Unable to load this article.
        </div>
      `;

    return;
  }


  currentArticle =
    data;

  currentContentHtml =
    "";

  currentMyNote =
    "";

  hasProtectedAccess =
    false;


  const {
    data: protectedContent,
    error: protectedError
  } =
    await supabaseClient
      .from("item_content")
      .select(
        "content_html, my_note"
      )
      .eq(
        "item_id",
        currentArticleId
      )
      .maybeSingle();


  if (protectedError) {

    console.warn(
      "Full content is not available for this session:",
      protectedError
    );

  }


  if (protectedContent) {

    hasProtectedAccess =
      true;

    currentContentHtml =
      protectedContent.content_html || "";

    currentMyNote =
      protectedContent.my_note || "";

  }


  renderReadMode();

}


/* ========================================
   DATE
======================================== */

function formatDate(value) {

  if (!value) {
    return "";
  }


  const date =
    new Date(value);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return "";
  }


  return date.toLocaleDateString(
    "en-US",
    {
      year: "numeric",
      month: "long",
      day: "numeric"
    }
  );

}


/* ========================================
   READ MODE
======================================== */

function renderReadMode() {

  hideFloatingTools();


  const container =
    document.getElementById(
      "article-container"
    );


  const data =
    currentArticle;


  if (!data) {
    return;
  }


  const title =
    safeText(
      data.title
    );

  const ticker =
    safeText(
      data.ticker
    );

  const category =
    safeText(
      data.category
    );

  const type =
    safeText(
      data.type
    );

  const tags =
    safeText(
      data.tags
    );

  const description =
    safeText(
      data.description
    );

  const preview =
    safeText(
      data.preview ||
      data.description ||
      ""
    );

  const note =
    safeText(
      currentMyNote
    );

  const originalUrl =
    cleanUrl(
      data.url
    );

  const published =
    formatDate(
      data.created_at
    );

  const updated =
    formatDate(
      data.updated_at
    );

  const membersOnly =
    data.access_level === "members";


  /*
    For Members Only articles, item_content is the protected source.
    Approved members/admins receive that row through RLS.
    Pending users and public visitors do not.
  */

  const canReadFull =
    !membersOnly ||
    hasProtectedAccess ||
    isAdminSession();


  const contentHtml =
    canReadFull &&
    currentContentHtml
      ? DOMPurify.sanitize(
          currentContentHtml
        )
      : "";


  document.title =
    title
      ? title +
        " | North Current Research"
      : "North Current Research";


  container.innerHTML =
    `

      <article class="article">

        <h1>
          ${
            ticker
              ? ticker + " — "
              : ""
          }
          ${title}
        </h1>


        <div class="meta">

          ${
            category
              ? `
                <span class="tag">
                  ${category}
                </span>
              `
              : ""
          }

          ${
            ticker
              ? `
                <span class="tag">
                  ${ticker}
                </span>
              `
              : ""
          }

          ${
            type
              ? `
                <span class="tag">
                  ${type}
                </span>
              `
              : ""
          }

          ${
            tags
              ? `
                <span class="tag">
                  ${tags}
                </span>
              `
              : ""
          }

          ${
            membersOnly
              ? `
                <span class="members-badge">
                  🔒 Members Only
                </span>
              `
              : ""
          }

        </div>


        <div class="dates">

          ${
            published
              ? `
                <div>
                  <strong>Published:</strong>
                  ${published}
                </div>
              `
              : ""
          }

          ${
            updated
              ? `
                <div>
                  <strong>Last Updated:</strong>
                  ${updated}
                </div>
              `
              : ""
          }

        </div>


        ${
          !canReadFull
            ? `

              <div class="locked-card">

                <h2>
                  🔒 Members Only
                </h2>

                ${
                  preview
                    ? `
                      <p>
                        ${preview}
                      </p>
                    `
                    : ""
                }

                <p>
                  Log in to continue reading this article.
                </p>

                <a
                  href="member.html"
                  class="login-to-read"
                >
                  Log In →
                </a>

              </div>

            `
            : `

              ${
                description
                  ? `
                    <div class="section">
                      <h2>Description</h2>
                      <p>${description}</p>
                    </div>
                  `
                  : ""
              }


              ${
                contentHtml
                  ? `
                    <div class="article-content">
                      ${contentHtml}
                    </div>
                  `
                  : ""
              }


              ${
                note
                  ? `
                    <div class="section">
                      <h2>My Note</h2>
                      <p>${note}</p>
                    </div>
                  `
                  : ""
              }


              ${
                originalUrl
                  ? `
                    <a
                      href="${originalUrl}"
                      target="_blank"
                      rel="noopener noreferrer"
                      class="original-link"
                    >
                      Read Original →
                    </a>
                  `
                  : ""
              }

            `
        }

      </article>

    `;


  fixOrderedListNumbering(
    container.querySelector(
      ".article-content"
    )
  );

}


/* ========================================
   ENTER EDIT MODE
======================================== */

async function enterEditMode() {

  const {
    data: {
      session
    }
  } =
    await supabaseClient
      .auth
      .getSession();


  currentSession =
    session;


  if (!isAdminSession()) {

    updateAuthUI();

    alert(
      "Admin access only."
    );

    return;
  }


  if (!currentArticle) {
    return;
  }


  renderEditMode();

}


/* ========================================
   EDIT MODE
======================================== */

function renderEditMode() {

  const container =
    document.getElementById(
      "article-container"
    );


  container.innerHTML =
    `

      <div class="edit-mode">

        <h1>
          Edit Article

/* ========================================
   SAVE
======================================== */

async function saveChanges() {

  const {
    data: {
      session
    }
  } =
    await supabaseClient
      .auth
      .getSession();


  currentSession =
    session;


  if (!isAdminSession()) {

    alert(
      "Your admin session has ended. Please log in again."
    );

    updateAuthUI();

    return;
  }


  if (
    !inlineEditor ||
    !currentArticleId
  ) {
    return;
  }


  const message =
    document.getElementById(
      "save-message"
    );


  message.textContent =
    "Saving...";


  let contentHtml =
    inlineEditor
      .root
      .innerHTML
      .trim();


  if (
    contentHtml ===
    "<p><br></p>"
  ) {
    contentHtml =
      "";
  }

const updatedItem = {

    title:
      document
        .getElementById(
          "edit-title"
        )
        .value
        .trim(),

    url:
      document
        .getElementById(
          "edit-url"
        )
        .value
        .trim(),

    type:
      document
        .getElementById(
          "edit-type"
        )
        .value,

    ticker:
      document
        .getElementById(
          "edit-ticker"
        )
        .value
        .trim()
        .toUpperCase(),

    category:
      document
        .getElementById(
          "edit-category"
        )
        .value,

    access_level:
      document
        .getElementById(
          "edit-access"
        )
        .value,

    tags:
      document
        .getElementById(
          "edit-tags"
        )
        .value
        .trim(),

    preview:
      document
        .getElementById(
          "edit-preview"
        )
        .value
        .trim(),

    updated_at:
      new Date().toISOString()

  };


  if (!updatedItem.title) {

    message.textContent =
      "Title cannot be empty.";

    return;
  }


  const {
    data: savedItem,
    error: itemError
  } =
    await supabaseClient
      .from("items")
      .update(
        updatedItem
      )
      .eq(
        "id",
        currentArticleId
      )
      .select()
      .single();


  if (itemError) {

    console.error(
      itemError
    );

    message.textContent =
      "Save failed: " +
      itemError.message;

    return;
  }


    const protectedUpdate = {

    content_html:
      contentHtml,

    my_note:
      document
        .getElementById(
          "edit-note"
        )
        .value
        .trim(),

    updated_at:
      new Date().toISOString()

  };


  const {
    data: updatedContent,
    error: protectedError
  } =
    await supabaseClient
      .from("item_content")
      .update(
        protectedUpdate
      )
      .eq(
        "item_id",
        currentArticleId
      )
      .select();


  if (protectedError) {

    console.error(
      "Article content update error:",
      protectedError
    );

    message.textContent =
      "Article details were saved, but article content could not be saved: " +
      protectedError.message;

    return;
  }


  /*
    If this article does not yet have
    an item_content row, create one.
  */

  if (
    !updatedContent ||
    updatedContent.length === 0
  ) {

    const {
      error: insertContentError
    } =
      await supabaseClient
        .from("item_content")
        .insert([
          {
            item_id:
              currentArticleId,

            content_html:
              contentHtml,

            my_note:
              document
                .getElementById(
                  "edit-note"
                )
                .value
                .trim(),

            updated_at:
              new Date().toISOString()
          }
        ]);


    if (insertContentError) {

      console.error(
        "Article content insert error:",
        insertContentError
      );

      message.textContent =
        "Article details were saved, but article content could not be created: " +
        insertContentError.message;

      return;
    }

  }


  currentArticle =
    savedItem;

  currentContentHtml =
    protectedUpdate.content_html;

  currentMyNote =
    protectedUpdate.my_note;

  hasProtectedAccess =
    true;


  inlineEditor =
    null;

  lastSelection =
    null;


  hideFloatingTools();

  renderReadMode();


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* ========================================
   CANCEL EDIT
======================================== */

function cancelEdit() {

  inlineEditor =
    null;

  lastSelection =
    null;

  hideFloatingTools();

  renderReadMode();

}


/* ========================================
   SELECTION TOOLBAR
======================================== */

function setupSelectionToolbar() {

  if (!inlineEditor) {
    return;
  }


  inlineEditor.on(
    "selection-change",
    function(
      range
    ) {

      if (
        !isAdminSession() ||
        !range ||
        range.length <= 0
      ) {

        lastSelection =
          null;

        hideFloatingToolbar();

        return;
      }


      lastSelection =
        {
          index:
            range.index,

          length:
            range.length
        };


      const bounds =
        inlineEditor.getBounds(
          range.index,
          range.length
        );


      const editorRect =
        inlineEditor
          .container
          .getBoundingClientRect();


      const toolbar =
        document.getElementById(
          "floating-toolbar"
        );


      toolbar.style.left =
        (
          editorRect.left +
          bounds.left
        ) +
        "px";


      toolbar.style.top =
        (
          editorRect.top +
          bounds.top -
          45
        ) +
        "px";


      toolbar.style.display =
        "flex";

    }
  );

}


/* ========================================
   RIGHT CLICK MENU
======================================== */

function setupRightClickMenu() {

  if (!inlineEditor) {
    return;
  }


  inlineEditor
    .root
    .addEventListener(
      "contextmenu",
      function(event) {

        if (
          !isAdminSession() ||
          !lastSelection ||
          lastSelection.length <= 0
        ) {
          return;
        }


        event.preventDefault();


        const menu =
          document.getElementById(
            "context-menu"
          );


        menu.style.left =
          event.clientX +
          "px";


        menu.style.top =
          event.clientY +
          "px";


        menu.style.display =
          "block";

      }
    );

}


/* ========================================
   FORMAT HELPERS
======================================== */

function canFormat() {

  return Boolean(
    isAdminSession() &&
    inlineEditor &&
    lastSelection &&
    lastSelection.length > 0
  );

}


function applyFormat(format) {

  if (!canFormat()) {
    return;
  }


  const current =
    inlineEditor.getFormat(
      lastSelection.index,
      lastSelection.length
    );


  inlineEditor.formatText(
    lastSelection.index,
    lastSelection.length,
    format,
    !current[format]
  );


  hideContextMenu();

}


function applySize(size) {

  if (!canFormat()) {
    return;
  }


  inlineEditor.formatText(
    lastSelection.index,
    lastSelection.length,
    "size",
    size
  );


  hideContextMenu();

}


function applyFont(font) {

  if (!canFormat()) {
    return;
  }


  inlineEditor.formatText(
    lastSelection.index,
    lastSelection.length,
    "font",
    font
  );


  hideContextMenu();

}


function applyTextColor(color) {

  if (!canFormat()) {
    return;
  }


  inlineEditor.formatText(
    lastSelection.index,
    lastSelection.length,
    "color",
    color
  );


  hideContextMenu();

}


function toggleHighlight() {

  if (!canFormat()) {
    return;
  }


  const current =
    inlineEditor.getFormat(
      lastSelection.index,
      lastSelection.length
    );


  const highlighted =
    current.background ===
    "#fff59d" ||
    current.background ===
    "rgb(255, 245, 157)";


  inlineEditor.formatText(
    lastSelection.index,
    lastSelection.length,
    "background",
    highlighted
      ? false
      : "#fff59d"
  );


  hideContextMenu();

}


function clearSelectedFormatting() {

  if (!canFormat()) {
    return;
  }


  inlineEditor.removeFormat(
    lastSelection.index,
    lastSelection.length
  );


  hideContextMenu();

}


/* ========================================
   HIDE TOOLS
======================================== */

function hideFloatingToolbar() {

  const toolbar =
    document.getElementById(
      "floating-toolbar"
    );


  if (toolbar) {
    toolbar.style.display =
      "none";
  }

}


function hideContextMenu() {

  const menu =
    document.getElementById(
      "context-menu"
    );


  if (menu) {
    menu.style.display =
      "none";
  }

}


function hideFloatingTools() {

  hideFloatingToolbar();
  hideContextMenu();

}


/* ========================================
   GLOBAL CLICK
======================================== */

document.addEventListener(
  "click",
  function(event) {

    const menu =
      document.getElementById(
        "context-menu"
      );


    if (
      menu &&
      !menu.contains(
        event.target
      )
    ) {
      hideContextMenu();
    }

  }
);


/* ========================================
   ORDERED LIST DISPLAY FIX
======================================== */

function fixOrderedListNumbering(root) {

  if (!root) {
    return;
  }

  const orderedLists =
    Array.from(
      root.querySelectorAll("ol")
    );

  let nextNumber =
    1;

  let previousWasOrderedList =
    false;


  orderedLists.forEach(
    function(list) {

      const previous =
        list.previousElementSibling;

      const continuesPreviousList =
        previous &&
        previous.tagName === "OL";


      if (!continuesPreviousList) {
        nextNumber =
          1;
      }


      if (
        nextNumber > 1 &&
        !list.hasAttribute("start")
      ) {
        list.setAttribute(
          "start",
          String(nextNumber)
        );
      }


      nextNumber +=
        list.querySelectorAll(
          ":scope > li"
        ).length;


      previousWasOrderedList =
        true;
    }
  );

}


/* ========================================
   TEXT SAFETY
======================================== */

function safeText(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }


  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


/* ========================================
   URL SAFETY
======================================== */

function cleanUrl(value) {

  if (!value) {
    return "";
  }


  try {

    const url =
      new URL(value);


    if (
      url.protocol !== "http:" &&
      url.protocol !== "https:"
    ) {
      return "";
    }


    return safeText(
      url.href
    );

  }


  catch {
    return "";
  }

}

======================================== */

  await loadArticle();

}


startPage();
